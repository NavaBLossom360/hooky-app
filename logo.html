<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hooky logo studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 30px; background: #07050f; color: #f4f1ff; font-family: Inter, system-ui, sans-serif; }
    h1 { font-size: 18px; font-weight: 900; margin: 0 0 16px; }
    .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 30px; }
    canvas { display: block; }
    .ios { border-radius: 22.5%; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .label { font-size: 12px; color: #a79fc4; margin-top: 8px; }
    .wm { background: #0f0b1e; padding: 30px; border-radius: 24px; }
    button { font: inherit; font-weight: 900; background: #c8ff4f; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; }
    a { color: #ff7ab0; }
  </style>
</head>
<body>
  <h1>Hooky logo studio</h1>
  <div class="row" id="icons"></div>
  <div class="row"><div class="wm"><canvas id="wm"></canvas></div></div>
  <div class="row"><button onclick="download()">Download all PNGs</button></div>
  <script>
    const PINK = "#ff4f8b", ORANGE = "#ff7a59", LIME = "#c8ff4f", BG = "#0f0b1e";

    // Draws the wordmark "hooky" with the y's tail turned into a fish hook.
    // Returns the box it occupied. `em` is the font size in px.
    function drawWordmark(ctx, cx, baseline, em) {
      ctx.save();
      ctx.font = `900 ${em}px Inter`;
      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "left";
      ctx.letterSpacing = `${-0.045 * em}px`;
      const W = ctx.measureText("hooky").width;
      const W4 = ctx.measureText("hook").width;
      const x0 = cx - W / 2;
      const yStart = x0 + W4, Wy = W - W4;
      const g = ctx.createLinearGradient(x0, 0, x0 + W, 0);
      g.addColorStop(0, PINK); g.addColorStop(0.55, ORANGE); g.addColorStop(1, LIME);
      // Word without the y's original descender.
      ctx.save();
      ctx.beginPath(); ctx.rect(x0 - em, baseline - 1.2 * em, W + 2 * em, 1.2 * em + 0.03 * em); ctx.clip();
      ctx.fillStyle = g; ctx.fillText("hooky", x0, baseline);
      ctx.restore();
      // Hook tail.
      const hx = yStart + 0.47 * Wy;            // where the y's arms meet
      const sw = 0.155 * em;                    // stroke matches Inter Black stems
      const r = 0.17 * em;
      const top = baseline - 0.12 * em, drop = baseline + 0.22 * em;
      ctx.strokeStyle = g; ctx.lineWidth = sw; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(hx, top); ctx.lineTo(hx, drop);
      ctx.arc(hx - r, drop, r, 0, Math.PI, false);   // curl left along the bottom
      ctx.lineTo(hx - 2 * r, drop - 0.10 * em);       // point rising up
      ctx.stroke();
      ctx.beginPath();                                 // barb
      ctx.moveTo(hx - 2 * r, drop - 0.10 * em); ctx.lineTo(hx - 2 * r + 0.11 * em, drop - 0.02 * em);
      ctx.stroke();
      ctx.restore();
      return { x: x0, w: W, top: baseline - 0.75 * em, bottom: drop + r + sw / 2 };
    }

    // Renders the wordmark on a transparent layer so glow can be applied without clip artifacts.
    function wordmarkLayer(S, cx, baseline, em) {
      const c = document.createElement("canvas"); c.width = c.height = S;
      drawWordmark(c.getContext("2d"), cx, baseline, em);
      return c;
    }
    function drawIcon(ctx, S) {
      ctx.fillStyle = BG; ctx.fillRect(0, 0, S, S);
      let g = ctx.createRadialGradient(S * 0.2, S * 0.1, 0, S * 0.2, S * 0.1, S * 0.9);
      g.addColorStop(0, "rgba(255,79,139,0.45)"); g.addColorStop(1, "rgba(255,79,139,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      g = ctx.createRadialGradient(S * 0.85, S * 0.95, 0, S * 0.85, S * 0.95, S * 0.8);
      g.addColorStop(0, "rgba(139,92,246,0.55)"); g.addColorStop(1, "rgba(139,92,246,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      // Soft glow behind the word.
      const layer = wordmarkLayer(S, S / 2, S * 0.575, S * 0.285);
      ctx.save(); ctx.shadowColor = "rgba(255,79,139,0.6)"; ctx.shadowBlur = S * 0.07; ctx.drawImage(layer, 0, 0); ctx.restore();
      ctx.drawImage(layer, 0, 0);
    }

    async function render() {
      await document.fonts.load("900 100px Inter");
      const icons = document.getElementById("icons"); icons.innerHTML = "";
      for (const S of [1024, 512, 192, 180]) {
        const wrap = document.createElement("div");
        const c = document.createElement("canvas"); c.width = c.height = S; c.id = "icon" + S;
        c.style.width = c.style.height = Math.min(S, 220) + "px"; c.className = "ios";
        drawIcon(c.getContext("2d"), S);
        wrap.appendChild(c);
        const l = document.createElement("div"); l.className = "label"; l.textContent = S + " px"; wrap.appendChild(l);
        icons.appendChild(wrap);
      }
      const wm = document.getElementById("wm"); wm.width = 1600; wm.height = 620; wm.style.width = "560px";
      const ctx = wm.getContext("2d"); ctx.clearRect(0, 0, 1600, 620);
      drawWordmark(ctx, 800, 420, 420);
      document.title = "Hooky logo studio (ready)";
    }
    function exportAll() {
      const out = {};
      for (const S of [1024, 512, 192, 180]) out["icon-" + S] = document.getElementById("icon" + S).toDataURL("image/png").split(",")[1];
      out["wordmark"] = document.getElementById("wm").toDataURL("image/png").split(",")[1];
      return out;
    }
    async function upload() {
      const all = exportAll(); const done = [];
      for (const [name, b64] of Object.entries(all)) {
        const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const r = await fetch("/upload?name=" + name + ".png", { method: "POST", body: bytes });
        done.push(name + ":" + r.status);
      }
      return done;
    }
    function download() {
      const all = exportAll();
      for (const [name, b64] of Object.entries(all)) { const a = document.createElement("a"); a.href = "data:image/png;base64," + b64; a.download = name + ".png"; a.click(); }
    }
    render();
  </script>
</body>
</html>
